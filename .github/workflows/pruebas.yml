name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  humo:
    name: Prueba de humo (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compila todo el Python
        run: python -m compileall -q .
      - name: Prueba de humo (notas inventadas en una carpeta temporal)
        run: python herramientas/prueba_humo.py
